veis e consistentes com o Design System.\nLimitações e cuidados ao utilizar IA nesse processo.\n\nEm resumo: uma abordagem prática de como combinar Flutter + Design System + IA para reduzir o gap entre o que foi especificado no design e o que realmente chega à aplicação.", "nivel": "Intermediário", "conexao": "Minha apresentação aborda diretamente o papel da Inteligência Artificial na transformação da forma como desenvolvemos software, conectando-se ao tema “Criar, proteger, escalonar: a era agêntica”.", "deck": "Ainda não, mas tenho materiais, o processo seria só de juntar isso e compilar num power point", "tags": ["Palestra", "IA / Agentes", "Mobile", "Arquitetura", "Dados"]}, {"id": "t049", "formato": "Palestra (até 30 minutos)", "titulo": "IA Generativa no ambiente Oracle Cloud", "resumo": "Iremos demonstrar como funciona a IA Generativa no ambiente da oracle cloud, juntamente com aplicações práticas que conseguimos utilizar no Grupo Thema|Polis", "nivel": "Iniciante", "conexao": "é voltado a IA e introduz o tema para quem tem curiosidade", "deck": "https://canva.link/ol9qzd1w620ntqg    Em caso de não conseguir visualizar, estamos a disposição via email ou whatsapp para ajuste.", "tags": ["Palestra", "IA / Agentes", "Cloud"]}, {"id": "t050", "formato": "Palestra (até 30 minutos)", "titulo": "Antes de escalar agentes: cinco decisões de arquitetura e governança que evitam a automação errada", "resumo": "Agentes de IA tornam possível automatizar processos cada vez mais complexos — mas a capacidade técnica de automatizar não responde à pergunta mais importante: o que realmente deveria ser delegado à máquina?\n\nNesta palestra, apresento um framework prático de cinco decisões que deveriam acontecer antes de escalar uma solução agêntica: qual problema estamos realmente resolvendo; qual é o custo de um erro; que nível de autonomia faz sentido; onde deve permanecer a validação humana; e que evidências precisamos obter antes de colocar a solução em produção.\n\nA partir dessas perguntas, discutiremos consequências concretas para arquitetura e engenharia: limites de autonomia, human-in-the-loop, permissões e acesso a dados, observabilidade, mecanismos de fallback, validação e accountability.\n\nA proposta não é adicionar burocracia à IA, mas mostrar como decisões melhores antes da arquitetura podem produzir sistemas mais simples, seguros e escaláveis.", "nivel": "Intermediário", "conexao": "O tema “Criar, proteger, escalonar” descreve exatamente o desafio que surge com sistemas agênticos: criar agentes ficou relativamente fácil; decidir como protegê-los e quando estão realmente prontos para escalar continua sendo difícil.\n\nA palestra conecta os três verbos. Criar, ao transformar uma necessidade de negócio em decisões arquiteturais claras. Proteger, ao definir limites de autonomia, validação humana, responsabilidade e mecanismos de segurança. Escalonar, ao estabelecer quais evidências um piloto precisa produzir antes de ganhar mais autonomia e chegar à produção.\n\nA ideia é discutir a era agêntica não apenas pela ótica do que os agentes conseguem fazer, mas pelas decisões que permitem utilizá-los com responsabilidade em sistemas reais.", "deck": "Ainda não. A apresentação será desenvolvida especificamente para o DevFest Porto Alegre 2026 a partir da proposta submetida.", "tags": ["Palestra", "IA / Agentes", "Arquitetura", "Segurança", "Dados", "Legado"]}, {"id": "t051", "formato": "Palestra (até 30 minutos)", "titulo": "DORA na Era da IA: Medindo Impacto sem Criar Métricas que Enganam", "resumo": "A adoção de IA está mudando a forma como times de engenharia desenvolvem software, mas fica a dúvida: como diferenciar ganhos reais de produtividade de uma métrica que só parece boa no papel? Nesta palestra, vamos discutir  os conceitos fundamentais de métricas de engenharia, incluindo os riscos de otimizar indicadores isolados e o chamado efeito cobra, quando uma métrica mal desenhada acaba incentivando comportamentos que pioram justamente o que ela deveria melhorar.\n\nA partir disso, vamos explorar as métricas DORA (frequência de deploy, lead time para mudanças, taxa de falha em mudanças e tempo de recuperação) como forma de avaliar fluxo, confiabilidade e capacidade de entrega. Por fim, vamos discutir como usar esses indicadores para entender, com contexto, o ROI real da IA no ciclo de desenvolvimento. Não pela contagem de linhas geradas ou tickets fechados, mas pela redução de gargalos, aumento de qualidade e melhoria sustentável na entrega de valor.", "nivel": "Iniciante", "conexao": "Minha apresentação se conecta aos três verbos do tema deste ano: criar, proteger e escalonar.\nNa era agêntica, agentes de IA já criam código e abrem pull requests dentro do próprio pipeline, o que acelera a entrega mas também multiplica o risco de escalar processos ruins junto com os bons. Sem métricas confiáveis, um time pode achar que está escalando produtividade quando, na prática, está só escalando ruído: mais commits e mais atividade de IA, sem mais valor entregue ou estabilidade.\nTimes pressionados a usar IA podem otimizar métricas superficiais e acabar protegendo menos a qualidade do que entregam. As métricas DORA funcionam como proteção nesse cenário, porque exigem que todo ganho de velocidade venha acompanhado de estabilidade. A talk propõe uma reflexão direta: se a IA cria código de forma autônoma, quem garante que isso gera ROI real e não apenas trabalho extra depois? Medir bem é, em si, uma forma de proteger o time e escalar com responsabilidade na era agêntica.", "deck": "Ainda não", "tags": ["Palestra", "IA / Agentes", "Qualidade / Testes", "Dados", "DevOps / SRE", "Bem-estar"]}, {"id": "t052", "formato": "Laboratório (Lab)", "titulo": "Confia, mas confere — o básico de segurança", "resumo": "Segurança tem fama de ser uma lista infinita de coisas para saber. Não é. Se você olhar o que realmente aparece em produção, quase tudo cai em cinco famílias — e todas respondem à mesma pergunta: em quem esse código confiou sem conferir?\n\nNeste workshop a gente percorre as cinco, uma por uma, com o código errado e o código certo lado a lado: controle de acesso quebrado (o preço que veio do navegador), falhas de criptografia (a senha em texto puro), injeção (o comentário que virou script), configuração e segredos expostos (a chave que foi parar no front) e falhas de autenticação (o crachá que ninguém conferiu). São as cinco categorias mais frequentes do OWASP Top 10, traduzidas para o dia a dia de quem escreve código.\n\nDepois vem a parte prática: um capture the flag. Se você nunca ouviu falar, é um formato de desafio em que cada vulnerabilidade encontrada revela uma flag — um código escondido que prova que você chegou lá. Em vez de ouvir sobre a falha, você explora a falha: muda o preço no carrinho, injeta o script no campo de comentário, encontra a chave que ficou no front. Os desafios seguem as mesmas cinco famílias, na mesma ordem, começando pelos mais simples. Não é competição de hacker: é a mesma aula, só que acontecendo na sua tela.\n\nVocê sai com cinco perguntas que cabem na cabeça e que dá para aplicar já na próxima revisão de código.", "nivel": "Iniciante", "conexao": "O tema tem três eixos, e o nosso workshop mora inteiro no segundo: proteger.\n\nA era agêntica não criou vulnerabilidades novas — ela industrializou as antigas. Quando o código passa a ser gerado em volume, o que sai não erra em coisa exótica: erra no básico, nas mesmas cinco famílias de sempre, só que muito mais rápido e com uma aparência muito mais convincente. A Veracode mediu isso em mais de 150 modelos: acima de 95% de corretude sintática e 55% de aprovação em segurança. Em XSS, 15%.\n\nAo mesmo tempo, o gargalo do desenvolvimento mudou de lugar. Escrever ficou barato; revisar virou o trabalho. E ninguém revisa o que não sabe procurar. Some a isso o fato de que a era agêntica trouxe muita gente nova construindo software — os \"criadores\" do tema — que nunca passou por nenhuma formação em segurança.\n\nÉ por isso que, para nós, um workshop de introdução a segurança é um assunto de era agêntica. O básico deixou de ser conteúdo de iniciante e virou pré-requisito para trabalhar com agentes. E é o tipo de conhecimento que escala num time: cinco perguntas que qualquer pessoa aplica em qualquer PR, tenha ele sido escrito por humano ou não.", "deck": "estamos desenvolvendo os slides e ja temos um piloto do Capture The Flag\n\nCTF: \nhttps://security-app-devfest-2026.vercel.app/\n\nSlide:  \nhttps://docs.google.com/presentation/d/1MmoB0MFr6gDgb5sg39IZ1WGaGc5RAgX3/edit?slide=id.p2#slide=id.p2", "tags": ["Laboratório", "IA / Agentes", "Segurança"]}, {"id": "t053", "formato": "Palestra (até 30 minutos)", "titulo": "Do incidente à engenharia: como IA, testes e regras de negócio podem tornar sistemas legados mais confiáveis", "resumo": "Sistemas legados sustentam processos críticos de muitas organizações, mas frequentemente acumulam regras de negócio distribuídas entre interface, código, banco de dados e configurações construídas ao longo de anos. Nesse cenário, uma alteração aparentemente localizada pode produzir efeitos inesperados em fluxos que já funcionavam.\nEsta palestra apresenta, de forma totalmente anonimizada, a experiência prática de investigação de uma regressão em um sistema corporativo legado baseado em .NET. Uma melhoria em um fluxo de aprovação expôs fragilidades relacionadas à seleção de atividades, permissões, atribuição de responsáveis e regras de workflow distribuídas por diferentes camadas da aplicação.\nEm vez de tratar cada novo sintoma como um bug isolado, o trabalho evoluiu para uma iniciativa de estabilização: reconstrução das regras de negócio junto aos usuários, investigação baseada em evidências, comparação entre ambientes, testes de retrocompatibilidade, identificação de pontos de alto acoplamento e planejamento de uma refatoração incremental.\nA experiência também trouxe uma segunda lição: IA acelera investigação e análise, mas respostas plausíveis não são evidências. Em sistemas críticos, sugestões produzidas por IA precisam ser confrontadas com código, banco, configuração, comportamento observado e conhecimento do negócio.\nA palestra mostra como transformar essa combinação entre conhecimento humano, IA e práticas de engenharia em um processo mais seguro para manter e modernizar sistemas legados.", "nivel": "Todos os níveis", "conexao": "A apresentação se conecta ao tema ao mostrar, a partir de uma experiência real de manutenção de um sistema legado, como IA pode apoiar o trabalho de engenharia sem substituir análise técnica, testes e conhecimento do negócio. A partir de incidentes em um fluxo crítico, foi necessário investigar código legado, entender regras que não estavam documentadas, trabalhar em conjunto com o time de negócio, preservar retrocompatibilidade e criar uma estratégia para tornar o sistema mais testável e sustentável. A proposta é compartilhar tanto os ganhos quanto os riscos do uso de IA nesse processo, principalmente quando uma sugestão parece correta tecnicamente, mas ainda precisa ser comprovada no contexto real do sistema. O foco é mostrar como combinar IA, engenharia de software e conhecimento humano para evoluir sistemas com mais segurança e menos regressões.", "deck": "Ainda não. A proposta nasceu de uma experiência que estou vivendo neste momento com a evolução de um sistema legado. Estou trabalhando na segunda etapa desse trabalho, com entrega prevista para o final de agosto, e os desafios que surgiram ao longo do processo mostraram que havia uma história maior para compartilhar: não apenas sobre corrigir erros, mas sobre entender um sistema legado, recuperar conhecimento sobre suas regras de negócio, trabalhar em conjunto com o time de negócio e evoluir o código com segurança, buscando estabilidade e retrocompatibilidade. Como essa experiência ainda está em andamento, pretendo montar a apresentação visual após concluir essa etapa e consolidar os principais aprendizados, tanto técnicos quanto interpessoais.", "tags": ["Palestra", "IA / Agentes", "Liderança / Gestão", "Segurança", "Qualidade / Testes", "Dados"]}, {"id": "t054", "formato": "Palestra (até 30 minutos)", "titulo": "AI Agentcs: SDD - Spec Driven Development no SLDC - Ciclo de desenvolvimento de software e Graph Engennier", "resumo": "Este relato de experiência apresenta o case real de modernização de APIs legadas para uma arquitetura moderna e segura. O grande diferencial do projeto foi a aplicação prática de Spec-Driven Development (SDD) orquestrada via Cursor e agentes de Inteligência Artificial com Loop engineering, transformando o ciclo de vida de desenvolvimento (SDLC).\nA abordagem utilizou uma estrutura de \"Harness Engineering\", uma camada de fundação que garante a confiabilidade dos artefatos gerados por IA por meio de guardrails rígidos, contratos claros e revisão humana ativa (Human-in-the-Loop). O fluxo cobriu desde a sanitização do legado e engenharia reversa automatizada até a geração de PRDs (Product Requirement Documents), especificações técnicas e tarefas de código testáveis e métricas.\nE de brinde um estudo e POC de graph Engennier para o mesmo case", "nivel": "Intermediário", "conexao": "Construir novas ideias, produtos, experiências e soluções — com IA como parceira de trabalho, não substituta e Escalonar\nLevar soluções para mais pessoas, mais times e mais negócios — sem perder qualidade pelo caminho.", "deck": "https://drive.google.com/file/d/1mIk-uI1ZBwdklI3WNY3c-JTgG9kt633N/view?usp=sharing", "tags": ["Palestra", "IA / Agentes", "Arquitetura", "Qualidade / Testes", "Produto", "Legado"]}, {"id": "t055", "formato": "Palestra (até 30 minutos)", "titulo": "Build. Scale. Breathe. — Performance sustentável para quem vive de tecnologia.", "resumo": "Em tecnologia, estamos acostumados a pensar em performance, escala, velocidade e evolução constante. Mas existe uma pergunta que raramente fazemos: a forma como estamos construindo nossas carreiras hoje é sustentável no longo prazo?\n\nA apresentação propõe uma reflexão prática sobre saúde mental, bem-estar e sustentabilidade na carreira em tecnologia, explorando como alta demanda, necessidade constante de atualização, autonomia, autocobrança e aceleração do trabalho podem impactar nossa relação com a carreira.\n\nA partir de conceitos da Psicologia Positiva e da Psicologia do Trabalho, como equilíbrio entre demandas e recursos e job crafting — o redesenho ativo do próprio trabalho —, vamos discutir caminhos para construir uma relação mais sustentável com performance, desenvolvimento e crescimento profissional.\n\nA palestra começa com uma breve experiência de respiração e uma pergunta reflexiva ao público, criando um momento de pausa antes de discutir justamente um dos grandes desafios do nosso tempo: como continuar crescendo sem transformar nosso bem-estar no custo da nossa performance?", "nivel": "Todos os níveis", "conexao": "Na era agêntica, estamos aprendendo rapidamente a usar inteligência artificial, automação e agentes para aumentar nossa capacidade de criar, produzir e escalar.\n\nMas, enquanto escalamos a tecnologia, também precisamos discutir como tornar sustentável o trabalho de quem constrói essas soluções.\n\nA IA pode reduzir o tempo necessário para determinadas tarefas, ampliar nossa produtividade e transformar a forma como trabalhamos. Ao mesmo tempo, essa aceleração pode trazer novas expectativas de performance, atualização constante e maior carga cognitiva.\n\nA proposta se conecta ao tema do DevFest justamente ao trazer uma perspectiva humana para essa transformação: não basta pensar em como criar e escalar mais; precisamos pensar em como construir carreiras capazes de acompanhar essa evolução de forma saudável e sustentável.", "deck": "A apresentação está em fase de estruturação e será desenvolvida especialmente para o DevFest Porto Alegre 2026, mas tenho um preview visual da apresentação, com a proposta de narrativa, identidade e alguns dos principais slides estruturados.\nhttps://splendorous-sunflower-7b11ad.netlify.app", "tags": ["Palestra", "IA / Agentes", "Carreira", "Bem-estar"]}, {"id": "t056", "formato": "Palestra (até 30 minutos)", "titulo": "O caminho curto que a gente descobriu do jeito longo - IA no desenvolvimento mobile: por onde começar e o que evitar", "resumo": "A ideia é falarmos sobre como está sendo nossa trajetória estando imersas no mundo de ia com o desenvolvimento mobile. Queremos levar nossa experiência, a diferença de como era o desenvolvimento antes/agora com I.A., os gaps que encontramos no meio do caminho, e abordar alguns tópicos como skills, MCPs, o que fazer e não fazer ao utilizar a I.A…", "nivel": "Todos os níveis", "conexao": "O DevFest é feito pela comunidade, e a nossa ideia é exatamente compartilhar conhecimento para ajudar a galera. Queremos mostrar nossos acertos e tropeços usando o Claude, para que outros devs daqui não precisem “bater cabeça” com as mesmas coisas. É uma palestra sem filtro, 100% focada no dia a dia, para ajudar quem quer começar a usar IA no mobile de um jeito que realmente funcione.", "deck": "Ainda não temos a apresentação visual. Mas estamos trabalhando em um roteiro", "tags": ["Palestra", "IA / Agentes", "Mobile", "Carreira", "Comunidade"]}, {"id": "t057", "formato": "Palestra (até 30 minutos)", "titulo": "Jornada na carreira como dev", "resumo": "Trazer pontos que ajudam a alavancar na carreira, desde o ínicio dela até como crescer e se desenvolver. Explicando o dia a dia, formas de estudo e de que forma podemos nos destacar agora que temos a IA em jogo.", "nivel": "Iniciante", "conexao": "Traz pontos além do código, como carreira, desenvolvimento pessoal, soft skills e integra com a IA, formas diferentes de se destacar agora com o uso dela.", "deck": "Tenho uma antiga mas precisarei reestruturar para ficar coerente com as mudanças. Então não tenho ainda :/", "tags": ["Palestra", "IA / Agentes", "Carreira"]}, {"id": "t058", "formato": /* ---------------- storage helpers ---------------- */
async function sGet(key, shared){
  try{ const r = await window.storage.get(key, !!shared); return r ? r.value : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ await window.storage.set(key, value, !!shared); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}
async function sList(prefix, shared){
  try{ const r = await window.storage.list(prefix, !!shared); return r ? r.keys : []; }
  catch(e){ return []; }
}
async function sDelete(key, shared){
  try{ await window.storage.delete(key, !!shared); return true; }
  catch(e){ return false; }
}

}

function tagStyle(tag){
  const p = TAG_PALETTE[tag] || {c:'#9AA3B2', bg:'rgba(154,163,178,0.08)'};
  return `color:${p.c}; background:${p.bg}; border-color:${p.c}22;`;

function slug(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function shuffle(arr, seed){
  // simple seeded shuffle so it's stable per voter
  let a = arr.slice();
  let s = seed;
  function rnd(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function seedFromString(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h % 100000 + 1;
}

/* ---------------- init ---------------- */
async function init(){
  const savedId = await sGet('device-voter-id', false);
  if(savedId){
    voterId = savedId;
    voterEmail = savedId;
    const parsed = await backendGetVoter(voterId);
    if(parsed){
      order = parsed.order;
      votes = parsed.votes || {};
      cursor = firstUnanswered();
      view = (cursor >= order.length) ? 'locked' : 'voting';
      render();
      return;
    }
  }
  view = 'landing';
  render();
}

function firstUnanswered(){
  for(let i=0;i<order.length;i++){
    if(!votes[order[i]]) return i;
  }
  return order.length; // all answered
}

async function startSession(rawEmail){
  const email = normalizeEmail(rawEmail);
  if(!isValidEmail(email)){
    landingError = 'Digite um e-mail válido.';
    render();
    return;
  }
  voterEmail = email;
  voterId = email;

  const existing = await backendGetVoter(voterId);
  if(existing){
    order = existing.order;
    votes = existing.votes || {};
    await sSet('device-voter-id', voterId, false);
    if(Object.keys(votes).length >= order.length){
      view = 'locked';
      render();
      return;
    }
    cursor = firstUnanswered();
    view = 'voting';
    render();
    return;
  }

  order = shuffle(TALKS.map(t=>t.id), seedFromString(voterId));
  votes = {};
  cursor = 0;
  await sSet('device-voter-id', voterId, false);
  await persist();
  view = 'voting';
  render();
}

async function persist(){
  await backendSaveVoter(voterId, {email:voterEmail, order, votes});
}

async function castVote(talkId, nota, desempate){
  votes[talkId] = {nota, desempate};
  await persist();
}

/* ---------------- render ---------------- */
function render(){
  const stage = document.getElementById('stage');
  const topRight = document.getElementById('topbarRight');
  const navSlot = document.getElementById('bottomNavSlot');
  const progressFill = document.getElementById('progressFill');

  topRight.innerHTML = '';
  navSlot.innerHTML = '';
  progressFill.style.width = '0%';

  if(view === 'loading'){
    stage.innerHTML = `<div class="loading-dots">Carregando…</div>`;
    return;
  }

  if(view === 'landing'){
    renderLanding(stage);
    return;
  }

  // voter chip + results link available in voting/locked/results
  const backendChip = document.createElement('div');
  backendChip.className = 'voter-chip backend-chip ' + (firebaseReady ? 'ok' : 'warn');
  backendChip.textContent = firebaseReady ? '● Firebase' : '● local';
  backendChip.title = firebaseReady
    ? 'Votos salvos em nuvem (Firestore)'
    : 'Firebase não configurado — votos salvos só no armazenamento local deste artifact';
  topRight.appendChild(backendChip);

  const chip = document.createElement('div');
  chip.className = 'voter-chip';
  chip.textContent = voterEmail ? voterEmail : '';
  if(voterEmail) topRight.appendChild(chip);

  if(isAdminEmail(voterEmail)){
    const resultsBtn = document.createElement('button');
    resultsBtn.className = 'link-btn';
    resultsBtn.textContent = view === 'results' ? '← Voltar a votar' : 'Ver resultados (admin)';
    resultsBtn.onclick = () => { view = (view === 'results') ? (cursor>=order.length ? 'locked':'voting') : 'results'; render(); };
    topRight.appendChild(resultsBtn);
  }

  if(view === 'voting'){
    const answered = Object.keys(votes).length;
    progressFill.style.width = (answered/order.length*100) + '%';
    renderVoting(stage, navSlot);
    return;
  }

  if(view === 'locked'){
    progressFill.style.width = '100%';
    renderLocked(stage);
    return;
  }

  if(view === 'results'){
    renderResults(stage);
    return;
  }
}

function renderLanding(stage){
  stage.innerHTML = `
    <div class="landing">
      <div class="theme-line">
        <span class="theme-word c">Criar</span>·
        <span class="theme-word p">proteger</span>·
        <span class="theme-word s">escalonar</span>
      </div>
      <h1>Avalie as propostas sem saber quem palestra.</h1>
      <p class="desc">${TALKS.length} propostas de conteúdo para o DevFest Porto Alegre 2026. Cada uma recebe uma nota padrão (1–5) e uma nota de desempate (0–2). A ordem é embaralhada e nenhum nome de autor é exibido. Cada e-mail vota uma única vez.</p>
      <div class="landing-form">
        <input id="emailInput" type="email" placeholder="seu-email@exemplo.com" maxlength="120" autocomplete="email" inputmode="email">
        ${landingError ? `<div class="landing-error">${landingError}</div>` : ''}
        <button class="primary-btn" id="startBtn">Começar votação</button>
      </div>
      <div class="landing-meta">devfestportoalegre.com.br</div>
    </div>
  `;
  const input = document.getElementById('emailInput');
  const btn = document.getElementById('startBtn');
  input.addEventListener('keydown', e => { if(e.key === 'Enter') tryStart(); });
  btn.addEventListener('click', tryStart);
  function tryStart(){
    const v = input.value.trim();
    if(!v || !isValidEmail(v)){
      landingError = 'Digite um e-mail válido.';
      input.style.borderColor = 'var(--danger)';
      render();
      return;
    }
    landingError = '';
    btn.disabled = true;
    btn.textContent = 'Verificando…';
    startSession(v);
  }
  setTimeout(()=>input.focus(), 50);
}

function renderVoting(stage, navSlot){
  if(cursor >= order.length){
    view = 'locked';
    render();
    return;
  }
  const talkId = order[cursor];
  const talk = TALKS.find(t => t.id === talkId);
  const existing = votes[talkId] || {nota:null, desempate:null};

  const tagsHtml = talk.tags.map(tag => `<span class="tag" style="${tagStyle(tag)}">${tag}</span>`).join('');
  const deckHtml = (talk.deck && talk.deck.match(/https?:\/\//))
    ? `<a class="deck-link" href="${talk.deck.match(/https?:\/\/\S+/)[0]}" target="_blank" rel="noopener">Ver material de apoio ↗</a>`
    : `<div class="no-deck">Sem material de apoio enviado ainda.</div>`;

  stage.innerHTML = `
    <div class="card">
      <div class="card-meta">
        <span class="meta-pill">${talk.formato}</span>
        <span class="meta-pill level">${talk.nivel}</span>
        <span class="card-index">${cursor+1} / ${order.length}</span>
      </div>
      <h2>${talk.titulo}</h2>
      <div class="tags">${tagsHtml}</div>

      <div class="section-label">Resumo</div>
      <p class="body-text">${talk.resumo}</p>

      <div class="section-label">Conexão com o tema</div>
      <p class="conexao">${talk.conexao}</p>

      ${deckHtml}

      <div class="vote-block">
        <div class="vote-row">
          <div class="vote-title">
            <span class="label">Nota (obrigatória)</span>
            <span class="hint">1 = fraco · 5 = excelente</span>
          </div>
          <div class="btn-row" id="notaRow">
            ${[1,2,3,4,5].map(n => `<button class="score-btn ${existing.nota===n?'selected-nota':''}" data-nota="${n}">${n}</button>`).join('')}
          </div>
        </div>
        <div class="vote-row">
          <div class="vote-title">
            <span class="label">Critério de desempate</span>
            <span class="hint">0 a 2</span>
          </div>
          <div class="btn-row" id="desempateRow">
            ${[0,1,2].map(n => `<button class="score-btn ${existing.desempate===n?'selected-desempate':''}" data-desempate="${n}">${n}</button>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `;

  let selNota = existing.nota;
  let selDesempate = existing.desempate;

  const notaBtns = [...document.querySelectorAll('#notaRow .score-btn')];
  const desBtns = [...document.querySelectorAll('#desempateRow .score-btn')];

  notaBtns.forEach(b => b.addEventListener('click', () => {
    selNota = parseInt(b.dataset.nota, 10);
    notaBtns.forEach(x => x.classList.remove('selected-nota'));
    b.classList.add('selected-nota');
    maybeAdvance();
  }));
  desBtns.forEach(b => b.addEventListener('click', () => {
    selDesempate = parseInt(b.dataset.desempate, 10);
    desBtns.forEach(x => x.classList.remove('selected-desempate'));
    b.classList.add('selected-desempate');
    maybeAdvance();
  }));

  let advanceTimer = null;
  async function maybeAdvance(){
    if(selNota === null || selDesempate === null) return;
    await castVote(talkId, selNota, selDesempate);
    updateNavStatus();
    updateProgress();
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(() => {
      if(cursor < order.length - 1){ cursor++; render(); }
      else { view = 'locked'; render(); }
    }, 380);
  }

  function updateProgress(){
    const answered = Object.keys(votes).length;
    document.getElementById('progressFill').style.width = (answered/order.length*100) + '%';
  }

  renderVotingNav(navSlot);

  // keyboard: 1-5 for nota
  const keyHandler = (e) => {
    if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if(['1','2','3','4','5'].includes(e.key)){
      const n = parseInt(e.key,10);
      selNota = n;
      notaBtns.forEach(x => x.classList.remove('selected-nota'));
      const target = notaBtns.find(b => parseInt(b.dataset.nota,10) === n);
      if(target) target.classList.add('selected-nota');
      maybeAdvance();
    } else if(e.key === 'ArrowRight'){ goNext(); }
    else if(e.key === 'ArrowLeft'){ goPrev(); }
  };
  document.addEventListener('keydown', keyHandler, {once:false});
  // clean up on next render to avoid stacking listeners
  stage._cleanup && stage._cleanup();
  stage._cleanup = () => document.removeEventListener('keydown', keyHandler);
}

function renderVotingNav(navSlot){
  navSlot.innerHTML = `
    <div class="bottom-nav">
      <button class="nav-btn" id="prevBtn">← Anterior</button>
      <span class="nav-status" id="navStatus"></span>
      <button class="nav-btn primary" id="nextBtn">Próxima →</button>
    </div>
  `;
  document.getElementById('prevBtn').onclick = goPrev;
  document.getElementById('nextBtn').onclick = goNext;
  document.getElementById('prevBtn').disabled = cursor === 0;
  updateNavStatus();
}
function updateNavStatus(){
  const el = document.getElementById('navStatus');
  if(!el) return;
  const answered = Object.keys(votes).length;
  el.textContent = answered + ' / ' + order.length + ' votadas';
}
function goPrev(){ if(cursor>0){ cursor--; render(); } }
function goNext(){
  const talkId = order[cursor];
  if(cursor < order.length - 1){ cursor++; render(); }
  else if(votes[talkId]){ view = 'locked'; render(); }
}

function renderLocked(stage){
  const answered = Object.keys(votes).length;
  stage.innerHTML = `
    <div class="done">
      <div class="theme-line">
        <span class="theme-word c">Criar</span>·
        <span class="theme-word p">proteger</span>·
        <span class="theme-word s">escalonar</span>
      </div>
      <div class="big">Voto registrado ✅</div>
      <p>${voterEmail} já avaliou as ${answered} propostas. Obrigado por participar da votação do DevFest Porto Alegre 2026 — cada e-mail vota uma única vez, então este e-mail não pode votar novamente.</p>
      <div class="done-actions">
        <button class="nav-btn" id="switchEmailBtn">Entrar com outro e-mail</button>
      </div>
    </div>
  `;
  document.getElementById('switchEmailBtn').onclick = async () => {
    voterId = null;
    voterEmail = null;
    order = [];
    votes = {};
    cursor = 0;
    landingError = '';
    await sDelete('device-voter-id', false);
    view = 'landing';
    render();
  };
}

/* ---------------- results (aggregated across all voters) ---------------- */
async function renderResults(stage){
  if(!isAdminEmail(voterEmail)){
    view = (order.length && cursor < order.length) ? 'voting' : 'locked';
    render();
    return;
  }
  stage.innerHTML = `<div class="loading-dots">Somando votos de todo mundo…</div>`;
  const allVoters = await backendGetAllVoters();
  const totals = {}; // talkId -> {sumNota, sumDesempate, count}
  TALKS.forEach(t => totals[t.id] = {sumNota:0, sumDesempate:0, count:0});

  let voterCount = 0;
  const rawVoterData = []; // {email, votes} for full backup export
  for(const parsed of allVoters){
    if(!parsed || !parsed.votes) continue;
    voterCount++;
    rawVoterData.push({email: parsed.email || '(desconhecido)', votes: parsed.votes});
    for(const [talkId, v] of Object.entries(parsed.votes)){
      if(!totals[talkId]) continue;
      totals[talkId].sumNota += v.nota;
      totals[talkId].sumDesempate += v.desempate;
      totals[talkId].count += 1;
    }
  }

  const rows = TALKS.map(t => {
    const tt = totals[t.id];
    const avgNota = tt.count ? tt.sumNota / tt.count : null;
    const avgDes = tt.count ? tt.sumDesempate / tt.count : null;
    return {talk:t, avgNota, avgDes, count:tt.count};
  }).sort((a,b) => {
    if(a.avgNota === null && b.avgNota === null) return 0;
    if(a.avgNota === null) return 1;
    if(b.avgNota === null) return -1;
    if(b.avgNota !== a.avgNota) return b.avgNota - a.avgNota;
    return (b.avgDes||0) - (a.avgDes||0);
  });

  if(voterCount === 0){
    stage.innerHTML = `<div class="empty-state">Ainda não há votos registrados por ninguém neste dispositivo compartilhado.<br>Assim que a equipe começar a votar, o ranking aparece aqui.</div>`;
    return;
  }

  window._lastResultsRows = rows;
  window._lastVoterCount = voterCount;
  window._lastRawVoterData = rawVoterData;

  stage.innerHTML = `
    <div class="results-wrap">
      <div class="results-header">
        <h2>Ranking geral</h2>
        <p>${voterCount} pessoa(s) votando · média da nota (1–5) e do desempate (0–2) · ordenado do maior para o menor</p>
        <div class="backup-actions">
          <button class="link-btn" id="exportCsvBtn">↓ Baixar ranking (CSV)</button>
          <button class="link-btn" id="exportJsonBtn">↓ Baixar backup completo (JSON)</button>
        </div>
      </div>
      <table class="results-table">
        <thead>
          <tr><th>#</th><th>Proposta</th><th>Formato</th><th>Nota média</th><th>Desempate médio</th><th>Votos</th></tr>
        </thead>
        <tbody>
          ${rows.map((r,i) => `
            <tr>
              <td class="rank-num">${i+1}</td>
              <td>
                <div class="ttitle">${r.talk.titulo}</div>
                <div class="small-dim">${r.talk.tags.slice(0,3).join(' · ')}</div>
              </td>
              <td class="small-dim">${r.talk.formato}</td>
              <td class="score-num">${r.avgNota!==null ? r.avgNota.toFixed(2) : '—'}</td>
              <td class="score-num tie">${r.avgDes!==null ? r.avgDes.toFixed(2) : '—'}</td>
              <td class="small-dim">${r.count}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('exportCsvBtn').onclick = () => exportRankingCsv(rows, voterCount);
  document.getElementById('exportJsonBtn').onclick = () => exportFullBackupJson(rows, rawVoterData, voterCount);
}

function csvEscape(v){
  const s = String(v == null ? '' : v);
  if(/[",\n;]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function triggerDownload(filename, mime, content){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function timestamp(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function exportRankingCsv(rows, voterCount){
  const header = ['posicao','titulo','formato','nivel','tags','nota_media','desempate_media','qtd_votos'];
  const lines = [header.join(';')];
  rows.forEach((r, i) => {
    lines.push([
      i+1,
      csvEscape(r.talk.titulo),
      csvEscape(r.talk.formato),
      csvEscape(r.talk.nivel),
      csvEscape(r.talk.tags.join(', ')),
      r.avgNota!==null ? r.avgNota.toFixed(2) : '',
      r.avgDes!==null ? r.avgDes.toFixed(2) : '',
      r.count
    ].join(';'));
  });
  const csv = '\ufeff' + lines.join('\n'); // BOM for Excel accents
  triggerDownload(`devfest-poa-2026-ranking-${timestamp()}.csv`, 'text/csv;charset=utf-8', csv);
}
function exportFullBackupJson(rows, rawVoterData, voterCount){
  const payload = {
    exportado_em: new Date().toISOString(),
    evento: 'DevFest Porto Alegre 2026',
    total_propostas: TALKS.length,
    total_votantes: voterCount,
    ranking: rows.map((r,i) => ({
      posicao: i+1,
      id: r.talk.id,
      titulo: r.talk.titulo,
      formato: r.talk.formato,
      nivel: r.talk.nivel,
      tags: r.talk.tags,
      nota_media: r.avgNota,
      desempate_media: r.avgDes,
      qtd_votos: r.count
    })),
    votos_brutos_por_pessoa: rawVoterData,
    propostas: TALKS
  };
  triggerDownload(`devfest-poa-2026-backup-${timestamp()}.json`, 'application/json;charset=utf-8', JSON.stringify(payload, null, 2));
}

init();
</script>
